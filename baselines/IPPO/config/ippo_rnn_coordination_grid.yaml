# CoordinationGrid recurrent IPPO — capability-vector partner build.
#
# Ego learns to allocate itself to RED or BLUE at t=0; the partner takes
# the complementary goal and moves subject to a per-goal cooldown
# (c_R, c_B). The capability profile is fixed per partner episode.
#
# See ippo_rnn_coordination_grid.py for the trainer + evaluate_policy().

"ENV_NAME": "coordination_grid"
"ENV_KWARGS":
  "layouts_dir": "/juice6/u/jshe/emergent_partner_grid/dev/grids_final/layouts/train"
  "augment_symmetries": False
  # 30 training capability pairs from {1,2,3,4,7,9}^2 minus 6 held-out.
  # See jaxmarl.environments.coordination_grid.TRAINING_CAPABILITY_PAIRS.
  "partner_capability_pairs":
    - [1, 1]
    - [1, 2]
    - [1, 3]
    - [1, 7]
    - [1, 9]
    - [2, 1]
    - [2, 2]
    - [2, 3]
    - [2, 4]
    - [2, 9]
    - [3, 1]
    - [3, 2]
    - [3, 3]
    - [3, 4]
    - [3, 7]
    - [4, 2]
    - [4, 3]
    - [4, 4]
    - [4, 7]
    - [4, 9]
    - [7, 1]
    - [7, 2]
    - [7, 4]
    - [7, 7]
    - [7, 9]
    - [9, 1]
    - [9, 3]
    - [9, 4]
    - [9, 7]
    - [9, 9]
  "rounds_per_episode": 20
  "max_steps": 64                    # widened from 15 so (9,9) etc. are
                                     # feasible on ~91% of layouts.
  "step_penalty": 0.02             # bumped from 0.01 to sharpen the
                                   # completion-time gradient under the
                                   # widened max_steps=64 horizon. See
                                   # project_log_revised.md §14.
  "success_reward": 1.0
  "hide_partner_until_time": 0
  "communication_condition": "action_only"

# Held-out eval on val + test layout pools. Both familiar and held-out
# capability pools are automatically evaluated in main().
"EVAL_LAYOUTS_DIRS":
  "val":  "/juice6/u/jshe/emergent_partner_grid/dev/grids_final/layouts/val"
  "test": "/juice6/u/jshe/emergent_partner_grid/dev/grids_final/layouts/test"
"EVAL_EPISODES_PER_CAPABILITY": 16
"EVAL_HELDOUT_CAPABILITY_PAIRS":
  - [1, 4]
  - [2, 7]
  - [3, 9]
  - [4, 1]
  - [7, 3]
  - [9, 2]
"EVAL_SEED": 12345

"SAVE_PARAMS_PATH": "/juice6/u/jshe/emergent_partner_grid/dev/train_logs/capability_params.safetensors"

"SEED": 1
"NUM_SEEDS": 1

# --- optimizer / schedule ---
"LR": 5e-4
"ANNEAL_LR": True
"LR_WARMUP": 0.05

# --- PPO rollout & update ---
"NUM_ENVS": 256
"NUM_STEPS": 256                     # bumped from 128 so a rollout spans a
                                     # few full 64-step rounds under the
                                     # wider horizon.
"UPDATE_EPOCHS": 4
"NUM_MINIBATCHES": 8

"TOTAL_TIMESTEPS": 60000000

# --- objective ---
"CLIP_EPS": 0.2
"ENT_COEF": 0.01
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"VF_COEF": 1.0
"MAX_GRAD_NORM": 0.25

# --- network ---
"FC_DIM_SIZE": 128
"GRU_HIDDEN_DIM": 128
"GRID_EMB_DIM": 64
"MSG_EMB_DIM": 8
"ACTIVATION": "relu"

# --- W&B (defaults to disabled) ---
"ENTITY": ""
"PROJECT": "coordination_grid"
"WANDB_MODE": "disabled"
