# CoordinationGrid recurrent IPPO — action_only regime.
#
# This is the pared-down configuration: only the action_only communication
# condition is supported. Multi-round partner episodes, z sampled per
# partner from a discrete pool, layouts vary per round.
#
# See ippo_rnn_coordination_grid.py for the trainer + evaluate_policy().

"ENV_NAME": "coordination_grid"
"ENV_KWARGS":
  # Training pool of layouts. The final corpus already has one D4 transform
  # baked in per base layout, so augment_symmetries stays False here.
  "layouts_dir": "/juice6/u/jshe/emergent_partner_grid/dev/grids_final/layouts/train"
  "augment_symmetries": False
  # Partner-type pool: one z sampled per partner-episode reset, held fixed
  # for all rounds of that episode. z is never in obs. Under action_only
  # the partner ignores z at commit-time (samples 50/50), so z is only used
  # to preserve schedule structure across the historical experiment plan.
  "partner_z_values": [0.1, 0.3, 0.5, 0.7, 0.9]
  # Rounds per partner episode (round_done ≠ episode_done, done['__all__']
  # only True after the final round). GRU hidden state persists across
  # intermediate round boundaries; only reset on partner-episode reset.
  "rounds_per_episode": 20
  # Per-round horizon.
  "max_steps": 15
  "step_penalty": 0.01
  "success_reward": 1.0
  # Info-structure knob (kept for API stability; final experiment uses 0).
  "hide_partner_until_time": 0
  # Only "action_only" is supported.
  "communication_condition": "action_only"

# Held-out eval on val + test layout pools (full partner-episodes, per-z
# breakdown, per-round-index success curve).
"EVAL_LAYOUTS_DIRS":
  "val":  "/juice6/u/jshe/emergent_partner_grid/dev/grids_final/layouts/val"
  "test": "/juice6/u/jshe/emergent_partner_grid/dev/grids_final/layouts/test"
"EVAL_EPISODES_PER_Z": 64
"EVAL_SEED": 12345

# Where to dump trained params (safetensors). Empty -> no save.
"SAVE_PARAMS_PATH": "/juice6/u/jshe/emergent_partner_grid/dev/train_logs/action_only_params.safetensors"

"SEED": 1
"NUM_SEEDS": 1

# --- optimizer / schedule ---
"LR": 5e-4
"ANNEAL_LR": True
"LR_WARMUP": 0.05

# --- PPO rollout & update ---
"NUM_ENVS": 256
"NUM_STEPS": 128       # 20 rounds × 15 max_steps = up to 300 steps per partner ep,
                       # so NUM_STEPS=128 covers roughly half an ep per rollout —
                       # the GRU hidden persists into the next rollout via runner_state.
"UPDATE_EPOCHS": 4
"NUM_MINIBATCHES": 8

# Episodes are ~20x longer than Stage B; bump total budget accordingly.
"TOTAL_TIMESTEPS": 60000000

# --- objective ---
"CLIP_EPS": 0.2
"ENT_COEF": 0.01
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"VF_COEF": 1.0
"MAX_GRAD_NORM": 0.25

# --- network ---
"FC_DIM_SIZE": 128
"GRU_HIDDEN_DIM": 128
"GRID_EMB_DIM": 64
"MSG_EMB_DIM": 8
"ACTIVATION": "relu"

# --- W&B (defaults to disabled; flip mode to "online" / "offline" to enable) ---
"ENTITY": ""
"PROJECT": "coordination_grid"
"WANDB_MODE": "disabled"
