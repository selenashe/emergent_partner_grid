hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - ENV_KWARGS.layouts_dir=/tmp/cg_stageB_smoke/train
    - ENV_KWARGS.augment_symmetries=true
    - ENV_KWARGS.partner_z_values=[0.2,0.4,0.6,0.8]
    - ENV_KWARGS.rounds_per_episode=3
    - ENV_KWARGS.hide_partner_until_time=0
    - ENV_KWARGS.communication_condition=partner_specific
    - EVAL_LAYOUTS_DIRS.val=/tmp/cg_stageB_smoke/val
    - EVAL_LAYOUTS_DIRS.test=/tmp/cg_stageB_smoke/test
    - EVAL_EPISODES_PER_Z=2
    - SAVE_PARAMS_PATH=/tmp/comm_smoke/partner_specific.safetensors
    - NUM_ENVS=8
    - NUM_STEPS=32
    - NUM_MINIBATCHES=2
    - UPDATE_EPOCHS=2
    - TOTAL_TIMESTEPS=512
    - +STDOUT_LOG=true
  job:
    name: ippo_rnn_coordination_grid
    chdir: null
    override_dirname: +STDOUT_LOG=true,ENV_KWARGS.augment_symmetries=true,ENV_KWARGS.communication_condition=partner_specific,ENV_KWARGS.hide_partner_until_time=0,ENV_KWARGS.layouts_dir=/tmp/cg_stageB_smoke/train,ENV_KWARGS.partner_z_values=[0.2,0.4,0.6,0.8],ENV_KWARGS.rounds_per_episode=3,EVAL_EPISODES_PER_Z=2,EVAL_LAYOUTS_DIRS.test=/tmp/cg_stageB_smoke/test,EVAL_LAYOUTS_DIRS.val=/tmp/cg_stageB_smoke/val,NUM_ENVS=8,NUM_MINIBATCHES=2,NUM_STEPS=32,SAVE_PARAMS_PATH=/tmp/comm_smoke/partner_specific.safetensors,TOTAL_TIMESTEPS=512,UPDATE_EPOCHS=2
    id: ???
    num: ???
    config_name: ippo_rnn_coordination_grid
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.3'
    cwd: /juice6/u/jshe/emergent_partner_grid
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /juice6/u/jshe/emergent_partner_grid/baselines/IPPO/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /juice6/u/jshe/emergent_partner_grid/outputs/2026-09-24/23-28-59
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
