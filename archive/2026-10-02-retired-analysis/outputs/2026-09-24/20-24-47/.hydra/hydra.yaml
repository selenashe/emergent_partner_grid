hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - SEED=1
    - NUM_SEEDS=1
    - ENV_KWARGS.layouts_dir=/juice6/u/jshe/emergent_partner_grid/dev/grids/layouts/train
    - ENV_KWARGS.partner_z_values=[0.2,0.4,0.6,0.8]
    - ENV_KWARGS.rounds_per_episode=20
    - ENV_KWARGS.max_steps=15
    - ENV_KWARGS.augment_symmetries=true
    - ENV_KWARGS.hide_partner_until_time=3
    - EVAL_LAYOUTS_DIRS.val=/juice6/u/jshe/emergent_partner_grid/dev/grids/layouts/val
    - EVAL_LAYOUTS_DIRS.test=/juice6/u/jshe/emergent_partner_grid/dev/grids/layouts/test
    - EVAL_EPISODES_PER_Z=64
    - SAVE_PARAMS_PATH=/juice6/u/jshe/emergent_partner_grid/dev/train_logs/stage_cd_R20_hideK3_seed1_20260924_202349.safetensors
    - NUM_ENVS=256
    - NUM_STEPS=128
    - UPDATE_EPOCHS=4
    - NUM_MINIBATCHES=8
    - TOTAL_TIMESTEPS=60000000
    - LR=5e-4
    - WANDB_MODE=disabled
    - ENTITY=
    - PROJECT=coordination_grid
    - +STDOUT_LOG=true
    - +STDOUT_SUMMARY=true
  job:
    name: ippo_rnn_coordination_grid
    chdir: null
    override_dirname: +STDOUT_LOG=true,+STDOUT_SUMMARY=true,ENTITY=,ENV_KWARGS.augment_symmetries=true,ENV_KWARGS.hide_partner_until_time=3,ENV_KWARGS.layouts_dir=/juice6/u/jshe/emergent_partner_grid/dev/grids/layouts/train,ENV_KWARGS.max_steps=15,ENV_KWARGS.partner_z_values=[0.2,0.4,0.6,0.8],ENV_KWARGS.rounds_per_episode=20,EVAL_EPISODES_PER_Z=64,EVAL_LAYOUTS_DIRS.test=/juice6/u/jshe/emergent_partner_grid/dev/grids/layouts/test,EVAL_LAYOUTS_DIRS.val=/juice6/u/jshe/emergent_partner_grid/dev/grids/layouts/val,LR=5e-4,NUM_ENVS=256,NUM_MINIBATCHES=8,NUM_SEEDS=1,NUM_STEPS=128,PROJECT=coordination_grid,SAVE_PARAMS_PATH=/juice6/u/jshe/emergent_partner_grid/dev/train_logs/stage_cd_R20_hideK3_seed1_20260924_202349.safetensors,SEED=1,TOTAL_TIMESTEPS=60000000,UPDATE_EPOCHS=4,WANDB_MODE=disabled
    id: ???
    num: ???
    config_name: ippo_rnn_coordination_grid
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.3'
    cwd: /juice6/u/jshe/emergent_partner_grid
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /juice6/u/jshe/emergent_partner_grid/baselines/IPPO/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /juice6/u/jshe/emergent_partner_grid/outputs/2026-09-24/20-24-47
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
